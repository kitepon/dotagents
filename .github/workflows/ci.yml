name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 週1回の健康診断だけ3環境の全検査を回す（月曜 03:30 JST）。
    - cron: "30 18 * * 0"
  workflow_dispatch:
    inputs:
      environment:
        description: 実行する環境
        type: choice
        default: all
        options:
          - all
          - macos-native
          - linux-workstation
          - windows-native
      comparison_base:
        description: "文書不変性を比較する既存commit/ref（例: origin/main~1）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    uses: ./.github/workflows/factory-full-ci.yml
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'all' }}
      comparison_base: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_base || '' }}
      dependency-command: npm ci --ignore-scripts
      documentation-command: make lint-md lint-current-docs lint-constitution lint-canon-migration lint-skills test-constitution test-current-docs
      full-command: >-
        node --version && npm --version && shellcheck --version && rg --version && codex --version && make --jobs="$FACTORY_CI_JOBS" ci
