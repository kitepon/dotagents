{
  "name": "SEC-002 Windows pinned product acceptance",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "environment": {
          "type": "choice",
          "default": "windows-native",
          "options": [
            "windows-native"
          ]
        },
        "comparison_base": {
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "sec002-windows-pinned-products",
    "cancel-in-progress": false
  },
  "jobs": {
    "windows-full": {
      "name": "Windows full (${{ matrix.product }})",
      "runs-on": [
        "self-hosted",
        "factory",
        "windows-native"
      ],
      "timeout-minutes": 30,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "product": "Throughline",
              "sha": "a226a1f0f343836277813d48fc9f57c007c8d23f",
              "dependency": "npm install --ignore-scripts --no-package-lock --no-audit --no-fund",
              "full": "node --version && node scripts/run-product-ci-tests.mjs && node bin/throughline.mjs --version"
            },
            {
              "product": "ServerManager",
              "sha": "9b77d654c5ee6e0f34074036d2f3a057650dc1d7",
              "dependency": "npm ci --prefix bughub",
              "full": "npm test"
            },
            {
              "product": "Caveat",
              "sha": "7eb238f28bc174a4ca83e49b526e0deaf8c0cecd",
              "dependency": "corepack pnpm install --frozen-lockfile",
              "full": "corepack pnpm build && corepack pnpm typecheck && corepack pnpm check:release-smoke && corepack pnpm test:claude-fresh-session-smoke && corepack pnpm test"
            },
            {
              "product": "Lattice",
              "sha": "3300d770b31e06a1b701e547c10d4899429e4024",
              "dependency": "npm ci && npm --prefix sensor ci",
              "full": "npm --prefix sensor run build && npm run ci"
            },
            {
              "product": "Spotter",
              "sha": "adbf7dfd8d94be917ff09db9459cb4767ce58c4b",
              "dependency": "npm ci --no-audit --no-fund",
              "full": "npm run verify:docs && npm test"
            },
            {
              "product": "aiterm-mcp",
              "sha": "8164deadeb2067dbde527b1a82364bd0682bf6d8",
              "dependency": "npm ci",
              "full": "node --version && npm --version && node scripts/run-product-ci-tests.mjs"
            },
            {
              "product": "gpt-connector",
              "sha": "3debbe61187f085107aa33ca6ca7022da4dca141",
              "dependency": "corepack pnpm install --frozen-lockfile",
              "full": "corepack pnpm check && corepack pnpm build && corepack pnpm test:codex-hooks && corepack pnpm test:release-gate"
            },
            {
              "product": "peertable",
              "sha": "f437688f5eedef598c49c55f3cbb119706e9fb9d",
              "dependency": "npm ci",
              "full": "node scripts/run-product-ci.mjs"
            }
          ]
        }
      },
      "env": {
        "PRODUCT_CI_TEST_SCOPE": "all",
        "PRODUCT_CI_TEST_FILES": "[]",
        "PINNED_SOURCE_SHA": "${{ matrix.sha }}"
      },
      "steps": [
        {
          "name": "dedicated Windows identity and privileges",
          "shell": "pwsh",
          "run": "$ErrorActionPreference='Stop'\n$identity=[Security.Principal.WindowsIdentity]::GetCurrent()\n$principal=[Security.Principal.WindowsPrincipal]::new($identity)\n$sid=([Security.Principal.NTAccount]::new($env:COMPUTERNAME,'factory-runner')).Translate([Security.Principal.SecurityIdentifier]).Value\nif ($identity.User.Value -ne $sid -or $env:RUNNER_NAME -ne 'factory-windows-fox-u' -or !$env:RUNNER_WORKSPACE.StartsWith('C:\\actions-runner-dotagents-u\\',[StringComparison]::OrdinalIgnoreCase)) {throw 'Dedicated identity/root differs'}\nif ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {throw 'Dedicated runner is administrator'}\n$listed=$false\ntry {[void][IO.Directory]::GetFileSystemEntries('C:\\Users\\kite_');$listed=$true} catch [UnauthorizedAccessException] {}\nif ($listed) {throw 'Old home is readable'}\n$privileges=& \"$env:SystemRoot\\System32\\whoami.exe\" /priv\nif ($LASTEXITCODE -ne 0 -or ($privileges -join \"`n\") -match 'Se(Impersonate|AssignPrimaryToken|Debug|Tcb|Backup|Restore|TakeOwnership|LoadDriver)Privilege') {throw 'Unexpected privileged token'}\n$privileges\n\"runner=$env:RUNNER_NAME sid=$($identity.User.Value)\"\n"
        },
        {
          "name": "checkout unchanged pinned product source",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "repository": "kitepon/${{ matrix.product }}",
            "ref": "${{ matrix.sha }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "verify source and product parallelism",
          "shell": "pwsh",
          "run": "$ErrorActionPreference='Stop'\n$head=git rev-parse HEAD\nif ($LASTEXITCODE -ne 0 -or $head -ne $env:PINNED_SOURCE_SHA) {throw 'Pinned source differs'}\n$jobs=node -p \"require('node:os').availableParallelism()\"\nif ($LASTEXITCODE -ne 0) {throw 'Product parallelism unavailable'}\n\"FACTORY_CI_JOBS=$jobs\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\"product-source=$head scope=all\"\n"
        },
        {
          "name": "dependency install identical to pinned product workflow",
          "shell": "pwsh",
          "run": "${{ matrix.dependency }}"
        },
        {
          "name": "product full test identical to pinned product workflow",
          "shell": "pwsh",
          "run": "${{ matrix.full }}"
        }
      ]
    }
  }
}
