name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 実行する環境
        type: choice
        default: all
        options:
          - all
          - macos-native
          - linux-server
          - linux-workstation
          - windows-native

permissions:
  contents: read

jobs:
  full:
    uses: ./.github/workflows/factory-full-ci.yml
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'all' }}
      documentation-command: make lint-md
      full-command: >-
        node --version && npm --version && shellcheck --version && rg --version && codex --version && make ci
