name: Factory full CI

on:
  workflow_call:
    inputs:
      full-command:
        description: 各環境で同一に実行する製品の最終通し試験（依存導入を含めない）
        required: true
        type: string
      dependency-command:
        description: 各環境で実行する依存導入。所要時間を試験本体と分けて表示する
        required: false
        default: ""
        type: string
      documentation-command:
        description: Markdownだけの変更時にLinux 1環境で実行する文書確認
        required: true
        type: string
      environment:
        description: all または単一の工場環境
        required: false
        default: all
        type: string
      comparison_base:
        description: workflow_dispatchまたはtagで使う明示的な比較元commit/ref
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  classify:
    runs-on: [self-hosted, factory, linux-workstation]
    timeout-minutes: 5
    outputs:
      product_change: ${{ steps.changes.outputs.product_change }}
      comparison_base: ${{ steps.changes.outputs.comparison_base }}
      environments: ${{ steps.changes.outputs.environments }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: classify change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE: ${{ inputs.comparison_base }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/dotagents-ci-plan.mjs plan
      - name: documentation dependency install
        if: steps.changes.outputs.product_change == 'false' && inputs.dependency-command != ''
        shell: bash
        run: ${{ inputs.dependency-command }}
      - name: documentation check
        if: steps.changes.outputs.product_change == 'false'
        shell: bash
        env:
          DOCUMENT_REGISTRY_BASE_REF: ${{ steps.changes.outputs.comparison_base }}
        run: ${{ inputs.documentation-command }}
      - name: skip product full CI
        if: steps.changes.outputs.product_change == 'false'
        shell: bash
        run: |
          printf 'Markdown-only change: product full CI is not required.\n'

  full:
    needs: classify
    if: needs.classify.outputs.product_change == 'true'
    env:
      DOCUMENT_REGISTRY_BASE_REF: ${{ needs.classify.outputs.comparison_base }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.classify.outputs.environments) }}
    timeout-minutes: 30
    runs-on: [self-hosted, factory, "${{ matrix.environment }}"]
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: logical CPU parallelism
        if: matrix.environment != 'windows-native'
        shell: bash
        run: |
          jobs=$(node -p "require('node:os').availableParallelism()")
          printf 'FACTORY_CI_JOBS=%s\n' "$jobs" >> "$GITHUB_ENV"
      - name: logical CPU parallelism
        if: matrix.environment == 'windows-native'
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: |
          jobs=$(node -p "require('node:os').availableParallelism()")
          printf 'FACTORY_CI_JOBS=%s\n' "$jobs" >> "$GITHUB_ENV"
      - name: dependency install
        if: inputs.dependency-command != '' && matrix.environment != 'windows-native'
        shell: bash
        run: ${{ inputs.dependency-command }}
      - name: dependency install
        if: inputs.dependency-command != '' && matrix.environment == 'windows-native'
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: ${{ inputs.dependency-command }}
      - name: product full test
        if: matrix.environment != 'windows-native'
        shell: bash
        run: ${{ inputs.full-command }}
      - name: product full test
        if: matrix.environment == 'windows-native'
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: ${{ inputs.full-command }}

  gate:
    needs: [classify, full]
    if: always()
    runs-on: [self-hosted, factory, linux-workstation]
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: verify selected CI results
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_RESULT: ${{ needs.full.result }}
          PRODUCT_CHANGE: ${{ needs.classify.outputs.product_change }}
        run: node scripts/dotagents-ci-plan.mjs verify
