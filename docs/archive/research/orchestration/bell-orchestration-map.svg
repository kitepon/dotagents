<svg viewBox="0 0 680 625" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">ベルのオーケストレーション全容 v2</title>
<desc id="de">依頼を通常レーンと統括レーンに分ける。通常は親が原子的に完了し、統括ではF/A/Hと必要な配置を使う。委譲利益が明確なAだけを書ける4枠へ渡し、委譲物は統括ゲートで検証する。</desc>
<style>
svg{--text-primary:#24211d;--text-secondary:#6b6459;--text-accent:#c65d3b;--border-strong:#cfc9be;--bg2:#f5f3ee;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}
