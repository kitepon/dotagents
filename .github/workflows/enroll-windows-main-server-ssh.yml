name: Enroll Windows main-server SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enroll:
    runs-on: [self-hosted, factory, linux-native]
    timeout-minutes: 5
    steps:
      - name: Enroll the permanent Windows public key
        shell: bash
        env:
          PUBLIC_KEY: ${{ secrets.MAIN_SERVER_WINDOWS_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          expected_comment='quolu@windows-main-server-20260830'
          if [[ "$(id -un)" != kite || "$HOME" != /home/kite ]]; then
            printf 'Unexpected runner identity: user=%s home=%s\n' "$(id -un)" "$HOME" >&2
            exit 1
          fi
          if [[ ! "$PUBLIC_KEY" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/]+={0,3}[[:space:]]${expected_comment}$ ]]; then
            printf 'MAIN_SERVER_WINDOWS_PUBLIC_KEY is missing or malformed\n' >&2
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          target="$HOME/.ssh/authorized_keys"
          touch "$target"
          chmod 600 "$target"
          line="no-agent-forwarding,no-port-forwarding,no-X11-forwarding $PUBLIC_KEY"
          count=$(grep -F -c "$expected_comment" "$target" || true)
          case "$count" in
            0)
              temp="$HOME/.ssh/authorized_keys.dotagents-enroll.$$"
              trap 'rm -f "$temp"' EXIT
              { cat "$target"; printf '%s\n' "$line"; } > "$temp"
              chmod 600 "$temp"
              mv "$temp" "$target"
              trap - EXIT
              ;;
            1)
              grep -Fqx "$line" "$target" || {
                printf 'Existing marker belongs to a different key or option set\n' >&2
                exit 1
              }
              ;;
            *)
              printf 'Duplicate main-server Windows key markers: %s\n' "$count" >&2
              exit 1
              ;;
          esac

          grep -Fqx "$line" "$target"
          remaining=$(grep -F -c "$expected_comment" "$target" || true)
          [[ "$remaining" == 1 ]]
          printf '%s\n' "$PUBLIC_KEY" | ssh-keygen -lf -
          printf 'Windows main-server SSH key enrolled exactly once.\n'
