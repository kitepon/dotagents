name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 実行する環境
        type: choice
        default: all
        options:
          - all
          - macos-native
          - linux-workstation
          - windows-native
      comparison_base:
        description: "文書不変性を比較する既存commit/ref（例: origin/main~1）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  full:
    uses: ./.github/workflows/factory-full-ci.yml
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'all' }}
      comparison_base: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_base || '' }}
      dependency-command: npm ci --ignore-scripts
      documentation-command: make lint-md lint-current-docs
      full-command: >-
        node --version && npm --version && shellcheck --version && rg --version && codex --version && make ci
